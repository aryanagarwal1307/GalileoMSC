# Single source of truth for human-experiment stimulus settings.
# Relative appearance masses; physical mass_ratio is ramp mass / table mass.
# The simulated table object's mass is always normalized to 1.0.
[materials]
wood = 1.0
brick = 2.0
metal = 8.0
white_ceramic = 1.0

[defaults]
enabled = true
# Full dimensions in meters, ordered x/y/z for ramp and table objects.
obj_ramp_dims = [0.24, 0.24, 0.12]
obj_table_dims = [0.24, 0.24, 0.12]
obj_frictions = [0.3, 0.3]
# Bullet multiplies object and surface friction: effective values are 0.6/0.025.
surface_frictions = [2.0, 0.08333333333333333]
ramp_clearance = 0.001
restitution = 0.5
# Existing ramp API placement parameters (ramp, table), not world coordinates.
# Move ramp block downhill and table block 0.125 m toward the ramp.
obj_positions = [0.5, 1.45]
slope = 0.6666666666666666
table_ramp_intersection = 0.0
physics_hz = 240
video_fps = 60
# Durations in seconds; timing and seed are consumed by the stimulus runner.
max_duration = 10.0
action_duration = 4.5
seed = 42

# Separate solid-gray practice stimulus: inherits every physics/timing default above.
# Excluded from the 12 main conditions and from --all; build with --practice.
[practice]
condition_id = "practice_equal_mass"
ramp_material = "white_ceramic"
table_material = "white_ceramic"
mass_ratio = 1.0
congruent = true

[[conditions]]
condition_id = "wood_to_brick_congruent"
ramp_material = "wood"
table_material = "brick"
mass_ratio = 0.5
congruent = true

[[conditions]]
